<mat-sidenav-container class="sidenav-container">
    <mat-sidenav #drawer class="sidenav" fixedInViewport
        [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
        [mode]="(isHandset$ | async) ? 'over' : 'side'"
        [opened]="(isHandset$ | async) === false"
        >
        <br/>
      <mat-toolbar> <img src={{strBase64}} style="width: 150px;"></mat-toolbar>
      <!--
      <br/>
      <mat-nav-list>
        <a mat-list-item routerLink="/home/allFiles">Todos arquivos</a>
        
      </mat-nav-list>
      -->
    </mat-sidenav>
    <mat-sidenav-content>
      <mat-toolbar color="primary">
        <button
          type="button"
          aria-label="Toggle sidenav"
          mat-icon-button
          (click)="drawer.toggle()"
          *ngIf="isHandset$ | async">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>        
          <span>Chamado {{chamado}} Manifestação {{maniSeq}}</span>
          <span class="example-spacer"></span>
          <!-- <button routerLink="/home" mat-icon-button class="example-icon home-icon">
            <mat-icon >home</mat-icon>
          </button> -->
          <button (click)="sair()" mat-icon-button class="example-icon">
           <mat-icon>logout</mat-icon>
         </button>
      </mat-toolbar>

      <div style="margin: 30px">

          <router-outlet></router-outlet>
      </div>
      
      

    </mat-sidenav-content>
  </mat-sidenav-container>
