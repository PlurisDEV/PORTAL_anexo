<div class="login-page">
    <div class="login-card">
        <div class="login-header">
            <div class="login-title">Acesso ao Sistema</div>
            <div class="login-subtitle">Insira suas credenciais para continuar</div>
        </div>

        <form [formGroup]="formLogin" novalidate (ngSubmit)="entrar()" class="login-form">
            <mat-form-field appearance="standard" floatLabel="never" class="login-field">
                <mat-icon matPrefix class="login-prefix">person</mat-icon>
                <input matInput placeholder="Login" formControlName="usuario" autocomplete="username">
            </mat-form-field>

            <mat-form-field appearance="standard" floatLabel="never" class="login-field">
                <mat-icon matPrefix class="login-prefix">lock</mat-icon>
                <input matInput placeholder="Senha" [type]="hide ? 'password' : 'text'" formControlName="senha" autocomplete="current-password">
                <button type="button" mat-icon-button matSuffix (click)="hide = !hide" class="login-suffix" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                    <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
            </mat-form-field>

            <button type="submit" class="login-button" [disabled]="formLogin.invalid">
                <mat-icon class="login-button-icon">login</mat-icon>
                Entrar
            </button>
        </form>
    </div>
</div>
